- id: '03'
  title: Delta Sync Troubleshooting
  sections:
  - id: '03.01'
    title: Resolving Delta Sync Problems
    objective: Provide steps to troubleshoot and resolve common issues related to
      delta synchronization in Entra ID Connect.
- id: '04'
  title: Attribute Filtering
  sections:
  - id: '04.01'
    title: Troubleshooting Attribute Filtering
    objective: Detail how to identify and fix issues with attribute filtering configurations
      in Entra ID Connect synchronization.
- id: '05'
  title: Password Hash Sync
  sections:
  - id: '05.01'
    title: Fixing Password Hash Sync Errors
    objective: Outline methods to diagnose and resolve password hash synchronization
