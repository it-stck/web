site_name: ITSTCK | Systems & Infrastructure
site_description: Enterprise Cloud Architecture, DevOps, Linux, Windows, Networking & SRE.
site_url: https://itstck.com/sys/

repo_name: it-stck/web/projects/sys
repo_url: https://github.com/it-stck/web/projects/sys
edit_uri: edit/main/web/projects/sys/docs/

docs_dir: docs

theme:
  name: material
  language: en
  logo: https://itstck.com/assets/img/logo.webp
  favicon: https://itstck.com/assets/img/favicon.ico
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: slate
      accent: green
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: slate
      accent: green
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true

plugins:
  - search
  - meta

