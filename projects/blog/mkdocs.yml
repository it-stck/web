site_name: ITSTCK | Tech Blog
site_description: Personal technical blog covering SysAdmin, DevSecOps, Cybersecurity, Linux, and Software Architecture.
site_url: https://itstck.com/blog/

repo_name: it-stck/web/projects/blog
repo_url: https://github.com/it-stck/web/projects/blog
edit_uri: edit/main/web/projects/blog/docs/

docs_dir: docs

theme:
  name: material
  language: en
  logo: https://itstck.com/assets/img/logo.webp
  favicon: https://itstck.com/assets/img/favicon.ico
  font:
    text: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: green
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - toc.integrate

extra_css:
  - assets/css/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - meta
  - blog:
      blog_dir: .
      post_dir: posts
      archive: false
      categories: true
      pagination: true
  - rss:
      match_path: posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags
      pretty_print: true

extra:
  generator: false

nav:
  - Home: index.md