site_name: ITSTCK | Data & Artificial Intelligence
site_description: Data Pipelines, Streaming, Data Warehousing, Agentic AI, RAG, and MLOps.
site_url: https://itstck.com/data/

repo_name: it-stck/web/projects/data
repo_url: https://github.com/it-stck/web/projects/data
edit_uri: edit/main/web/projects/data/docs/

docs_dir: docs

theme:
 name: material
 language: en
 logo: https://itstck.com/assets/img/logo.png
 favicon: https://itstck.com/assets/img/favicon.ico
 #font:
 # text: JetBrains Mono
 features:
   - navigation.tabs
   - navigation.tabs.sticky
   - navigation.sections
   - navigation.expand
   - navigation.path
   - navigation.top
   - navigation.indexes
   - navigation.tracking
   - navigation.footer
   - search.suggest
   - search.highlight
   - search.share
   - content.code.copy
   - content.code.annotate
   - content.tooltips
   #- header.autohide
   - toc.follow

 palette:
   # Selector de paleta para modo claro
   - media: "(prefers-color-scheme: light)"
     scheme: default
     primary: blue
     accent: green
     toggle:
       icon: material/toggle-switch
       name: Switch to dark mode
   # Selector de paleta para modo oscuro
   - media: "(prefers-color-scheme: dark)"
     scheme: slate
     primary: blue
     accent: green
     toggle:
       icon: material/toggle-switch-off-outline
       name: Switch to light mode

# Extensiones Markdown
markdown_extensions:
 - admonition
 - attr_list
 - def_list
 - footnotes
 - md_in_html
 - toc:
     permalink: true
     toc_depth: 3
 - pymdownx.arithmatex:
     generic: true
 - pymdownx.betterem:
     smart_enable: all
 - pymdownx.caret
 - pymdownx.details
 - pymdownx.emoji:
     emoji_index: !!python/name:material.extensions.emoji.twemoji
     emoji_generator: !!python/name:material.extensions.emoji.to_svg
 - pymdownx.highlight:
     anchor_linenums: true
     line_spans: __span
     pygments_lang_class: true
 - pymdownx.inlinehilite
 - pymdownx.keys
 - pymdownx.magiclink:
     repo_url_shorthand: true
 - pymdownx.mark
 - pymdownx.smartsymbols
 - pymdownx.superfences:
     custom_fences:
       - name: mermaid
         class: mermaid
         format: !!python/name:pymdownx.superfences.fence_code_format
 - pymdownx.tabbed:
     alternate_style: true
 - pymdownx.tasklist:
     custom_checkbox: true
 - pymdownx.tilde

plugins:
  - search
  - meta

